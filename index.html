<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛК ПК | AIShtab</title>
    <meta name="description" content="Личный кабинет руководителя проекта — сводный дашборд с метриками, событиями и аналитикой">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/global.css">
    <link rel="stylesheet" href="src/components/construction-object-selector/construction-object-selector.css?v=20260727">
    <link rel="stylesheet" href="src/components/construction-table/construction-table.css?v=20260727">
    <link rel="stylesheet" href="src/components/event-toolbar/event-toolbar.css">
    <link rel="stylesheet" href="src/features/filters/filter-drawer.css">
    <link rel="stylesheet" href="src/styles/event-list.css">
    <link rel="stylesheet" href="src/components/floating-action-bar/floating-action-bar.css">
    <link rel="stylesheet" href="src/components/event-card/event-card.css">
    <link rel="stylesheet" href="src/features/tasks/task-drawer.css">
    <link rel="stylesheet" href="src/features/metrics-dashboard/metrics-dashboard.css?v=20260817-summary-24">
    <link rel="stylesheet" href="src/features/metrics-dashboard/sections/procurement/procurement-metrics.css?v=20260817-risk-row-14">
    <link rel="stylesheet" href="src/features/bi/bi-modal.css">
    <link rel="stylesheet" href="src/features/analytics/ai-insights.css">
    <link rel="stylesheet" href="src/features/chat/ai-chat-core.css">
    <link rel="stylesheet" href="src/features/chat/scenter-ai-chat.css">
    <link rel="stylesheet" href="src/features/digital-chessboard/digital-chessboard.css?v=20260728a">
    <link rel="stylesheet" href="src/features/digital-chessboard-summary/digital-chessboard-summary.css?v=20260727">
    <link rel="stylesheet" href="src/features/objects/objects.css?v=20260727b">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-shell">
        <!-- Верхнее горизонтальное меню -->
        <header class="top-navbar">
            <div class="navbar-brand">
                <div class="logo">
                    <i data-lucide="building-2"></i>
                    <span>ЛК ПК | AIShtab</span>
                </div>
            </div>
            <nav class="navbar-nav">
                <a href="#" class="nav-item active" id="nav-dashboard">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Сводный дашборд</span>
                </a>
                <div class="nav-view-switcher" id="digital-view-switcher">
                    <button type="button" class="nav-item nav-view-trigger" id="nav-digital-chessboard"
                        aria-haspopup="menu" aria-expanded="false" aria-controls="digital-section-menu">
                        <i data-lucide="grid-3x3"></i>
                        <span>Цифровая шахматка</span>
                        <i data-lucide="chevron-down" class="nav-view-chevron" aria-hidden="true"></i>
                    </button>
                    <div class="nav-view-menu" id="digital-section-menu" role="menu"
                        aria-labelledby="nav-digital-chessboard" hidden>
                        <button type="button" class="nav-view-menu-item" role="menuitem"
                            data-main-view="digital-chessboard-summary" aria-current="false">
                            <i data-lucide="layout-dashboard" aria-hidden="true"></i>
                            <span>Сводка</span>
                            <i data-lucide="check" class="nav-view-menu-check" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="nav-view-menu-item" role="menuitem"
                            data-main-view="objects" aria-current="false">
                            <i data-lucide="building-2" aria-hidden="true"></i>
                            <span>Объекты</span>
                            <i data-lucide="check" class="nav-view-menu-check" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="nav-view-menu-item" role="menuitem"
                            data-main-view="digital-chessboard" aria-current="false">
                            <i data-lucide="grid-3x3" aria-hidden="true"></i>
                            <span>Шахматка</span>
                            <i data-lucide="check" class="nav-view-menu-check" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <button type="button" class="nav-item nav-item-future" id="nav-tasks" disabled aria-disabled="true" title="Раздел будет доступен в будущей версии">
                    <i data-lucide="list-todo" aria-hidden="true"></i>
                    <span>Трекер задач</span>
                    <span class="nav-future-badge">Скоро</span>
                </button>
                <button type="button" class="nav-item nav-item-future" id="nav-schedule" disabled aria-disabled="true" title="Раздел будет доступен в будущей версии">
                    <i data-lucide="calendar-days" aria-hidden="true"></i>
                    <span>ГПР и Расписание</span>
                    <span class="nav-future-badge">Скоро</span>
                </button>
                <button type="button" class="nav-item nav-item-future" id="nav-reports" disabled aria-disabled="true" title="Раздел будет доступен в будущей версии">
                    <i data-lucide="file-bar-chart" aria-hidden="true"></i>
                    <span>Процессные отчеты</span>
                    <span class="nav-future-badge">Скоро</span>
                </button>
            </nav>
            <div class="navbar-user">
                <div class="user-profile">
                    <div class="avatar">ИИ</div>
                    <div class="user-info">
                        <div class="user-name">Иван Иванов</div>
                        <div class="user-role">Руководитель проекта</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="content-area app-main-view" id="dashboard-view">
            <!-- Левая панель навигации -->
            <aside class="left-panel" id="left-sidebar">
                <div class="left-panel-header">
                    <div class="left-search-wrapper">
                        <div class="left-search-box">
                            <i data-lucide="search"></i>
                            <input type="text" placeholder="Поиск">
                        </div>
                        <button class="left-panel-collapse-btn">
                            <i data-lucide="chevron-left"></i>
                        </button>
                    </div>
                </div>
                <div class="project-tree-container" id="project-tree-root">
                    <!-- Tree rendered via JS -->
                </div>
            </aside>

            <!-- Центральная часть — Операционная лента событий -->
            <div class="main-wrapper">
                <main class="main-content" id="main-event-feed">
                    <!-- Sticky Header Wrapper -->
                    <div class="sticky-header-wrapper">
                        <div id="project-header-container"></div>
                        <div id="event-toolbar-root"></div>
                        <div class="priority-tabs-bar">
                            <div class="priority-tabs" role="tablist" aria-label="Приоритет событий">
                                <button class="priority-tab active" id="priority-tab-high" type="button" role="tab"
                                    aria-selected="true" onclick="setEventPriorityView('high')">
                                    <span>Высокий приоритет</span>
                                    <span class="priority-tab-badge primary" id="top-events-count">0</span>
                                </button>
                                <button class="priority-tab" id="priority-tab-low" type="button" role="tab"
                                    aria-selected="false" onclick="setEventPriorityView('low')">
                                    <span>Низкий приоритет</span>
                                    <span class="priority-tab-badge secondary" id="other-events-count">0</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Контейнер для результатов ленты (управляется через JS) -->
                    <div id="event-feed-sections">
                        <div class="priority-tab-panel" id="priority-events-panel" role="tabpanel">
                            <div class="events-grid" id="priority-events-container">
                                <!-- Event cards rendered via JS -->
                            </div>
                        </div>
                    </div>
                </main>
            </div>

        </div>

        <section class="app-main-view" id="digital-chessboard-summary-view" aria-label="Сводка цифровой шахматки" hidden>
            <div id="digital-chessboard-summary-root"></div>
        </section>
        <section class="app-main-view" id="digital-chessboard-view" aria-label="Цифровая шахматка" hidden>
            <div id="digital-chessboard-root"></div>
        </section>
        <section class="app-main-view" id="objects-view" aria-label="Объекты" hidden>
            <div id="objects-root"></div>
        </section>
    </div>

    <!-- Event Detail Drawer Overlay -->
    <div class="drawer-overlay" id="event-drawer-overlay"></div>

    <!-- Event Detail Drawer -->
    <div class="drawer right-drawer" id="event-drawer" role="dialog" aria-modal="true"
        aria-label="Детальная карточка события" aria-hidden="true">
        <div class="drawer-header" id="event-drawer-title-container">
            <div class="drawer-header-info" id="event-drawer-title">
                <!-- content rendered via JS -->
            </div>
            <button class="drawer-close-btn" id="close-event-drawer-btn"><i data-lucide="x"></i></button>
        </div>
        <div class="drawer-body" id="event-drawer-body">
            <!-- content rendered via JS -->
        </div>
        <div class="drawer-footer" id="event-drawer-footer">
            <!-- Footer actions rendered via JS -->
        </div>
    </div>

    <!-- AI Analytics Modal -->
    <div class="modal-overlay" id="ai-analytics-modal-overlay">
        <div class="modal-content analytics-modal" id="ai-analytics-modal">
            <!-- Loader centered within modal during analysis -->
            <div id="analytics-loader" class="ai-loading-overlay">
                <div class="ai-stars-loader">
                    <div class="ai-stars-box">
                        <i data-lucide="sparkles" class="ai-star"></i>
                        <i data-lucide="stars" class="ai-star"></i>
                        <i data-lucide="sparkle" class="ai-star"></i>
                    </div>
                </div>
            </div>

            <div class="modal-header ai-modal-header" id="analytics-modal-header" style="display: none;">
                <div class="ai-modal-title-row">
                    <div class="ai-modal-icon">
                        <i data-lucide="sparkles"></i>
                    </div>
                    <div>
                        <h2 class="ai-modal-title">Аналитика</h2>
                        <div id="analytics-modal-subtitle" class="ai-modal-subtitle">Событий: 0</div>
                    </div>
                </div>
                <button class="modal-close-btn" onclick="window.aiInsights.closeModal()"><i data-lucide="x"></i></button>
            </div>

            <div class="modal-body ai-modal-body" id="analytics-modal-body" style="display: none;">
                <!-- Content rendered via JS -->
            </div>

            <div class="modal-footer ai-modal-footer" id="analytics-modal-footer" style="display: none;">
                <button class="ai-btn-secondary" onclick="window.aiInsights.downloadReport()">
                    <i data-lucide="download" class="ai-btn-icon"></i>
                    Скачать отчет
                </button>
                <button class="ai-btn-secondary" onclick="window.aiInsights.closeModal()">Закрыть</button>
            </div>
        </div>
    </div>



    <!-- Confirm Delete Alert Dialog -->
    <div class="modal-overlay alert-dialog-overlay" id="alert-dialog-overlay">
        <div class="modal-content alert-dialog">
            <h3 class="alert-dialog-title">Скрыть событие?</h3>
            <p class="alert-dialog-text">Событие будет удалено из
                ленты. ИИ учтет это для будущих рекомендаций.</p>
            <div class="alert-dialog-actions">
                <button class="btn alert-dialog-cancel" id="alert-cancel-btn">Отмена</button>
                <button class="btn alert-dialog-confirm" id="alert-confirm-btn">Скрыть</button>
            </div>
        </div>
    </div>


    <!-- Floating Action Bar -->
    <div id="floating-bar-root" class="floating-bar-container"></div>

    <!-- S.Center AI Chat Mount -->
    <div id="scenter-ai-chat-root"></div>

    <!-- BI graph opened from the metric link inside an event drawer -->
    <div class="metric-bi-overlay" id="bi-modal-overlay" aria-hidden="true">
        <div id="bi-modal-v2-container"></div>
    </div>

    <script src="src/data/app-data.js"></script>
    <script src="src/data/procurement-metrics-data.js?v=20260817-no-demo-prefix"></script>
    <script src="src/data/metrics-dashboard-data.js"></script>
    <script src="src/data/task-data.js"></script>
    <script src="src/data/project-structure.js"></script>
    <script src="src/data/construction-objects-data.js?v=20260727"></script>
    <script src="src/data/digital-chessboard-data.js?v=20260727b"></script>
    <script src="src/data/objects-data.js?v=20260727"></script>
    <script src="src/data/digital-chessboard-summary-data.js?v=20260727"></script>
    <script src="src/ui/ui-core.js"></script>
    <script src="src/components/construction-object-selector/construction-object-selector.js?v=20260727"></script>
    <script src="src/components/construction-table/construction-table.js?v=20260727"></script>
    <script src="src/features/tasks/task-drawer.js"></script>
    <script src="src/features/metrics-dashboard/sections/procurement/procurement-metrics.js?v=20260817-donut-116"></script>
    <script src="src/features/metrics-dashboard/metrics-dashboard.js"></script>
    <script src="src/features/bi/bi-modal.js"></script>
    <script src="src/components/navigation-tree-item/navigation-tree-item.js"></script>
    <script src="src/components/event-card/event-card.js"></script>
    <script src="src/features/digital-chessboard/digital-chessboard.js?v=20260728a"></script>
    <script src="src/features/digital-chessboard-summary/digital-chessboard-summary.js?v=20260727"></script>
    <script src="src/features/objects/objects.js?v=20260727f"></script>
    <script src="src/app/app.js?v=20260727g"></script>
    <script src="src/components/event-toolbar/event-toolbar.js"></script>
    <script src="src/features/filters/filter-drawer.js"></script>
    <script src="src/components/floating-action-bar/floating-action-bar.js"></script>
    <script src="src/features/analytics/ai-insights.js"></script>
    <script src="src/features/chat/ai-chat-core.js"></script>
    <script src="src/features/chat/scenter-ai-chat-adapter.js"></script>
</body>

</html>
