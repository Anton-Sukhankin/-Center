<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛК ПК | Center</title>
    <meta name="description" content="Личный кабинет руководителя проекта — сводный дашборд с метриками, событиями и аналитикой">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/global.css">
    <link rel="stylesheet" href="src/components/event-toolbar/event-toolbar.css">
    <link rel="stylesheet" href="src/features/filters/filter-drawer.css">
    <link rel="stylesheet" href="src/styles/event-list.css">
    <link rel="stylesheet" href="src/components/floating-action-bar/floating-action-bar.css">
    <link rel="stylesheet" href="src/styles/financial-analysis.css">
    <link rel="stylesheet" href="src/components/event-card/event-card.css">
    <link rel="stylesheet" href="src/features/analytics/ai-insights.css">
    <link rel="stylesheet" href="src/features/metrics/metric-drawer.css">
    <link rel="stylesheet" href="src/features/bi/bi-modal-v2.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="app-shell">
        <!-- Верхнее горизонтальное меню -->
        <header class="top-navbar">
            <div class="navbar-brand">
                <div class="logo">
                    <i data-lucide="building-2"></i>
                    <span>ЛК ПК | Center</span>
                </div>
            </div>
            <nav class="navbar-nav">
                <a href="#" class="nav-item active" id="nav-dashboard">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Сводный дашборд</span>
                </a>
                <a href="#" class="nav-item" id="nav-tasks">
                    <i data-lucide="list-todo"></i>
                    <span>Трекер задач</span>
                </a>
                <a href="#" class="nav-item" id="nav-schedule">
                    <i data-lucide="calendar-days"></i>
                    <span>ГПР и Расписание</span>
                </a>
                <a href="#" class="nav-item" id="nav-reports">
                    <i data-lucide="file-bar-chart"></i>
                    <span>Процессные отчеты</span>
                </a>
            </nav>
            <div class="navbar-user">
                <div class="user-profile">
                    <div class="avatar">ИИ</div>
                    <div class="user-info">
                        <div class="user-name">Иван Иванов</div>
                        <div class="user-role">Руководитель проекта</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="content-area">
            <!-- Левая панель навигации -->
            <aside class="left-panel" id="left-sidebar">
                <div class="left-panel-header">
                    <div class="left-search-wrapper">
                        <div class="left-search-box">
                            <i data-lucide="search"></i>
                            <input type="text" placeholder="Поиск">
                        </div>
                        <button class="left-panel-collapse-btn">
                            <i data-lucide="chevron-left"></i>
                        </button>
                    </div>
                </div>
                <div class="project-tree-container" id="project-tree-root">
                    <!-- Tree rendered via JS -->
                </div>
            </aside>

            <!-- Центральная часть — Операционная лента событий -->
            <div class="main-wrapper">
                <main class="main-content" id="main-event-feed">
                    <!-- Sticky Header Wrapper -->
                    <div class="sticky-header-wrapper">
                        <div id="project-header-container"></div>
                        <div id="event-toolbar-root"></div>
                    </div>

                    <!-- Filter Inline Block -->


                    <!-- Контейнер для результатов ленты (управляется через JS) -->
                    <div id="event-feed-sections">
                        <!-- Топ-события — Accordion (раскрыт по умолчанию) -->
                        <div class="accordion-section" id="top-events-section">
                            <button class="accordion-header" id="top-events-toggle" aria-expanded="true">
                                <div class="accordion-header-left">
                                    <h3 class="accordion-title">Высокий приоритет</h3>
                                    <span class="accordion-badge primary" id="top-events-count">0</span>
                                </div>
                                <i data-lucide="chevron-down" class="accordion-chevron open" id="top-chevron"></i>
                            </button>
                            <div class="accordion-body open" id="top-events-body">
                                <div class="accordion-body-inner">
                                    <div class="events-grid" id="top-events-container">
                                        <!-- Top event cards rendered via JS -->
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Остальные события — Accordion (свёрнут по умолчанию) -->
                        <div class="accordion-section" id="other-events-section">
                            <button class="accordion-header" id="other-events-toggle" aria-expanded="false">
                                <div class="accordion-header-left">
                                    <h3 class="accordion-title secondary">Низкий приоритет</h3>
                                    <span class="accordion-badge secondary" id="other-events-count">0</span>
                                </div>
                                <i data-lucide="chevron-down" class="accordion-chevron" id="other-chevron"></i>
                            </button>
                            <div class="accordion-body" id="other-events-body">
                                <div class="accordion-body-inner">
                                    <div class="events-grid" id="other-events-container">
                                        <!-- Other event cards rendered via JS -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>

            <!-- Правая панель — Метрики -->
            <aside class="right-panel-wrapper" id="right-sidebar">
                <div class="resizer" id="right-resizer"></div>
                <div class="right-panel-content metrics-panel">
                    <!-- Верхний блок: Строительные показатели -->
                    <div class="metrics-static-block" id="fin-metrics-tree-start">
                        <!-- Rendered via JS -->
                    </div>

                    <!-- Нижний блок: Финансовые показатели — Drill-down окно -->
                    <div class="metrics-financial-block">
                        <div id="fin-active-metric"></div>

                        <!-- Children metrics -->
                        <div class="fin-children-list" id="fin-children-list">
                            <!-- Rendered via JS -->
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Event Detail Drawer Overlay -->
    <div class="drawer-overlay" id="event-drawer-overlay"></div>

    <!-- Event Detail Drawer -->
    <div class="drawer right-drawer" id="event-drawer">
        <div class="drawer-header" id="event-drawer-title-container">
            <div class="drawer-header-info" id="event-drawer-title">
                <!-- content rendered via JS -->
            </div>
            <button class="drawer-close-btn" id="close-event-drawer-btn"><i data-lucide="x"></i></button>
        </div>
        <div class="drawer-body" id="event-drawer-body">
            <!-- content rendered via JS -->
        </div>
        <div class="drawer-footer" id="event-drawer-footer">
            <!-- Footer actions rendered via JS -->
        </div>
    </div>

    <!-- AI Analytics Modal -->
    <div class="modal-overlay" id="ai-analytics-modal-overlay">
        <div class="modal-content analytics-modal" id="ai-analytics-modal">
            <!-- Loader centered within modal during analysis -->
            <div id="analytics-loader" class="ai-loading-overlay">
                <div class="ai-stars-loader">
                    <div class="ai-stars-box">
                        <i data-lucide="sparkles" class="ai-star"></i>
                        <i data-lucide="stars" class="ai-star"></i>
                        <i data-lucide="sparkle" class="ai-star"></i>
                    </div>
                </div>
            </div>

            <div class="modal-header ai-modal-header" id="analytics-modal-header" style="display: none;">
                <div class="ai-modal-title-row">
                    <div class="ai-modal-icon">
                        <i data-lucide="sparkles"></i>
                    </div>
                    <div>
                        <h2 class="ai-modal-title">Аналитика</h2>
                        <div id="analytics-modal-subtitle" class="ai-modal-subtitle">Событий: 0</div>
                    </div>
                </div>
                <button class="modal-close-btn" onclick="window.aiInsights.closeModal()"><i data-lucide="x"></i></button>
            </div>

            <div class="modal-body ai-modal-body" id="analytics-modal-body" style="display: none;">
                <!-- Content rendered via JS -->
            </div>

            <div class="modal-footer ai-modal-footer" id="analytics-modal-footer" style="display: none;">
                <button class="ai-btn-secondary" onclick="window.aiInsights.downloadReport()">
                    <i data-lucide="download" class="ai-btn-icon"></i>
                    Скачать отчет
                </button>
                <button class="ai-btn-secondary" onclick="window.aiInsights.closeModal()">Закрыть</button>
            </div>
        </div>
    </div>



    <!-- Confirm Delete Alert Dialog -->
    <div class="modal-overlay alert-dialog-overlay" id="alert-dialog-overlay">
        <div class="modal-content alert-dialog">
            <h3 class="alert-dialog-title">Скрыть событие?</h3>
            <p class="alert-dialog-text">Событие будет удалено из
                ленты. ИИ учтет это для будущих рекомендаций.</p>
            <div class="alert-dialog-actions">
                <button class="btn alert-dialog-cancel" id="alert-cancel-btn">Отмена</button>
                <button class="btn alert-dialog-confirm" id="alert-confirm-btn">Скрыть</button>
            </div>
        </div>
    </div>


    <!-- Floating Action Bar -->
    <div id="floating-bar-root" class="floating-bar-container"></div>

    <!-- BI Modal v2.0 Overlay -->
    <div id="bi-modal-overlay" style="display:none;">
        <div id="bi-modal-v2-container"></div>
    </div>

    <script src="src/data/app-data.js"></script>
    <script src="src/ui/ui-core.js"></script>
    <script src="src/components/navigation-tree-item/navigation-tree-item.js"></script>
    <script src="src/components/metric-card/metric-card.js"></script>
    <script src="src/components/construction-metric-card/construction-metric-card.js"></script>
    <script src="src/components/event-card/event-card.js"></script>
    <script src="src/app/app.js"></script>
    <script src="src/components/event-toolbar/event-toolbar.js"></script>
    <script src="src/features/filters/filter-drawer.js"></script>
    <script src="src/components/floating-action-bar/floating-action-bar.js"></script>
    <script src="src/features/analytics/ai-insights.js"></script>
    <script src="src/features/metrics/metric-drawer.js"></script>
    <script src="src/features/bi/bi-modal-v2.js"></script>
</body>

</html>
