<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>QA: цифровая шахматка</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; color: #0f172a; background: #e9eef5; font: 14px Inter, Arial, sans-serif; }
        h1 { margin: 0 0 18px; font-size: 20px; }
        main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        figure { min-width: 0; margin: 0; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; }
        figcaption { margin-bottom: 10px; color: #475569; font-weight: 600; }
        img { width: 100%; height: auto; display: block; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <h1>Сопоставление визуального контракта</h1>
    <main>
        <figure><figcaption>Согласованный референс</figcaption><img src="../../docs/reference/digital-chessboard/object-cards-and-metrics.png" alt="Согласованный референс цифровой шахматки"></figure>
        <figure><figcaption>Интеграция в активный прототип</figcaption><img src="01-integrated-prototype-cropped.png" alt="Интегрированная цифровая шахматка"></figure>
    </main>
</body>
</html>
